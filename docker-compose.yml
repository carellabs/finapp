name: finapp

# Rotacion de los logs de TODOS los servicios: sin tope, el `json-file` de Docker (el driver por
# defecto) crece hasta llenar el disco. 3 ficheros de 10 MB por servicio. Un test
# (.github/scripts/repo-config.test.mjs) exige `logging` con `max-size` y `max-file` en cada uno.
# Docker pone la marca de tiempo de cada linea: `docker compose logs -t`.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    # Solo loopback: la BD nunca se expone fuera de esta maquina.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      ORIGEN_FRONTEND: ${ORIGEN_FRONTEND:-http://localhost:5173}
      # Sin definir en .env pasan vacias y la API usa sus valores por defecto (ver env.example).
      MAX_SESIONES_POR_USUARIO: ${MAX_SESIONES_POR_USUARIO:-}
      PURGA_SESIONES_INTERVALO_MINUTOS: ${PURGA_SESIONES_INTERVALO_MINUTOS:-}
      FOTO_MENSUAL_OBJETIVOS_INTERVALO_MINUTOS: ${FOTO_MENSUAL_OBJETIVOS_INTERVALO_MINUTOS:-}
    # Solo loopback: el servidor de desarrollo no se expone a la red local.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      # Volumenes anonimos: los node_modules del contenedor (Alpine) no se
      # pisan con los del host (Windows).
      - /app/node_modules
      - /app/api/node_modules
      - /app/web/node_modules
      - /app/shared/node_modules
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Un solo origen: el navegador solo habla con :5173 y el servidor de Vite reenvia `/api` a la
      # API (web/vite.proxy.ts), como en produccion. Una VITE_API_URL absoluta en .env sigue valiendo.
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/api/node_modules
      - /app/web/node_modules
      - /app/shared/node_modules
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5173/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  datos-postgres:
