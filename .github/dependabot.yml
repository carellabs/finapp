# Actualizaciones de dependencias. Los títulos de los PR (prefijo + "bump ...")
# tienen que pasar la política de PR (.github/scripts/pr-policy.mjs): por eso el prefijo es un
# commit convencional. Dependabot está exento del límite de 100 caracteres del título (un grupo
# con un nombre largo lo supera: "bump X from A to B in the G group across 1 directory"), pero no
# del formato; los grupos tienen nombres cortos (npm, actions, docker, compose) para que el título
# se lea entero. Las etiquetas deben existir en el repo
# (se crean en .claude/skills/finapp-github/references/github-setup.md).
#
# Las major sueltas no entran en los grupos genéricos: cada una abre su propio PR para
# revisarla. La excepción son las familias de npm que tienen que subir juntas (grupos propios,
# con major incluida): sus miembros se piden como peer unos a otros, y una major de uno solo
# deja un lockfile que `npm ci` rechaza (ERESOLVE). Las que rompen algo conocido se ignoran aquí
# y se suben a mano. Un test (.github/scripts/repo-config.test.mjs) vigila las ignoradas, las
# familias con su evidencia, el orden de los grupos, sus nombres y el título más largo posible.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    groups:
      # Familias con peers entre sí (evidencia en package-lock.json: vitest <-> @vitest/coverage-v8
      # con la versión exacta; react-dom -> react; @types/react-dom -> @types/react; @eslint/js ->
      # eslint). Van ANTES del genérico `npm`: Dependabot asigna cada dependencia al primer
      # grupo que encaja, y `npm` encaja con todo.
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: ['major', 'minor', 'patch']
      react:
        patterns: ['react', 'react-dom']
        update-types: ['major', 'minor', 'patch']
      react-types:
        patterns: ['@types/react', '@types/react-dom']
        update-types: ['major', 'minor', 'patch']
      eslint:
        patterns: ['eslint', '@eslint/js']
        update-types: ['major', 'minor', 'patch']
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Los tipos de Node siguen la major del runtime (.nvmrc, imagen de Docker), que se
      # decide a mano: una major de @types/node sin cambiar de Node describe una API que
      # el runtime no tiene. Quitar al subir de Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint declara typescript como peer con tope (<6.1.0 hoy): una major de
      # typescript rompe el lint. Quitar cuando typescript-eslint soporte la siguiente.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    labels: ['type:chore']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'ci(deps)'
    labels: ['type:chore']

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ['*']
        # `node` va aparte: subir su versión exige tocar también .nvmrc (el CI y los
        # Dockerfiles usan la misma), y un PR que falla por eso no debe bloquear al resto.
        exclude-patterns: ['node']
        update-types: ['minor', 'patch']
    ignore:
      # La imagen `node` se queda en la línea 24 (LTS). Las impares (25, 27...) no son LTS y
      # saltar a otra par es una decisión que afecta a .nvmrc, a `engines` y a @types/node.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(deps)'
    labels: ['type:chore']

  # La imagen de Postgres de docker-compose.yml. Los tests de integración usan la misma
  # (IMAGEN en scripts/con-db-test.mjs), que Dependabot no ve: un test de
  # .github/scripts/repo-config.test.mjs vigila que sean idénticas, así que una subida de aquí
  # deja en rojo el check `test` hasta que se iguale a mano la del script.
  # El tag fija la versión menor (`16.15-alpine`, no `16-alpine`) a propósito: Dependabot solo
  # propone tags de la misma precisión que el actual, y con `16-alpine` solo vería mayores, que
  # se ignoran: la entrada no abriría nunca un PR. Un test lo exige.
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Una major de Postgres exige `pg_upgrade` sobre los datos (el volumen datos-postgres): se
      # decide y se hace a mano, junto con la imagen de scripts/con-db-test.mjs.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(deps)'
    labels: ['type:chore']
