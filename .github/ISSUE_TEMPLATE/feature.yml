name: Funcionalidad
description: Proponer una novedad o un cambio visible en FinApp
title: 'feat: '
labels: ['type:feature']
body:
  - type: markdown
    attributes:
      value: |
        Los cambios de tipo `feat` necesitan una issue. El PR que lo implemente se titula
        como un commit convencional (`feat(scope): descripción`) y cierra esta issue con
        `Closes #N` en su cuerpo.

        Este repositorio es público: no incluyas datos reales, dumps de la base de datos ni
        capturas con cifras propias. Para explicar la propuesta bastan datos inventados.
  - type: textarea
    id: necesidad
    attributes:
      label: Qué necesidad o problema resuelve
      description: Contexto y motivo. Qué no se puede hacer hoy o qué resulta incómodo.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Qué cambiarías y cómo debería verse o comportarse. Añade bocetos si ayudan.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Dominio y cálculos (shared)
        - Objetivos de ahorro
        - Insights y simulador
        - API
        - Web
        - Base de datos y migraciones
        - Docker, CI o despliegue
        - Otra
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Otras formas de resolverlo y por qué las descartas.
  - type: checkboxes
    id: condiciones
    attributes:
      label: Condiciones
      description: Se comprueban de nuevo en el PR.
      options:
        - label: Respeta las reglas de la skill que corresponde (tabla de `AGENTS.md`).
        - label: No requiere datos reales para describirse ni para probarse.
